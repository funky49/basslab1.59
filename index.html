<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>basslab by funky49</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
<header class="site-header">
  <div class="container header-inner">
    <button id="vizStopBtn" class="panic-viz">
      <canvas id="waveCanvas"></canvas>
      <span class="panic-text">WARNING — STOP ALL AUDIO</span>
    </button>
  </div>
</header>

<main class="container">
  <h2 class="freq-title">
    <span class="title-layer title-normal">Oobleck Dance Generator</span>
    <span class="title-layer title-invert">Oobleck Dance Generator</span>
  </h2>

  <div class="integrated-control-container">
    <button id="freqDownBtn" class="integrated-side-btn">−</button>
    <div id="mainKnob" class="knob main-knob">
      <div class="knob-indicator"></div>
      <div class="knob-center">
        <div class="knob-value" id="freqReadout">49</div>
        <div class="knob-unit">Hz</div>
      </div>
    </div>
    <button id="freqUpBtn" class="integrated-side-btn">+</button>
  </div>

  <div class="gen-controls">
    <button id="startBtn" class="btn">Start Generator</button>
    <button id="stopBtn" class="btn secondary">Stop All</button>
  </div>

  <div class="macro-grid">
    <button id="bassDropBtn" class="btn">Bass Drop</button>
    <button id="bassRiseBtn" class="btn">Bass Rise</button>
    <button id="testTonesBtn" class="btn">Test Tones</button>
    
    <button id="song1Btn" class="btn song-btn">Mary Lamb</button>
    <button id="song2Btn" class="btn song-btn">Frere Jacque</button>
    <button id="song3Btn" class="btn song-btn">Battle Hymn</button>
    <button id="song4Btn" class="btn song-btn">John Brown</button>
    <button id="song5Btn" class="btn song-btn">This Land</button>
    <button id="song6Btn" class="btn song-btn">Twinkle</button>
    <button id="song7Btn" class="btn song-btn">Row Your Boat</button>
    <button id="song8Btn" class="btn song-btn">Old MacDonald</button>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; basslab.science</p>
  </div>
</footer>

<script src="songs.js"></script>
<script src="script.js"></script>
</body>
</html>
