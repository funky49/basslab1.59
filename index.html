<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Oobleck Dance Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <button id="panicBtn" class="panic-viz">
                <canvas id="waveCanvas"></canvas>
                <span class="panic-text">STOP ALL AUDIO</span>
            </button>
        </div>
    </header>

    <main class="container">
        <h2 class="freq-title" id="oobleckTitle">
            <span class="title-layer title-normal">Oobleck Dance Station</span>
            <span class="title-layer title-invert">Oobleck Dance Station</span>
        </h2>

        <nav class="mode-selector">
            <button onclick="switchMode('tone')">TONE</button>
            <button onclick="switchMode('sweep')">SWEEP</button>
            <button onclick="switchMode('keyboard')">KEYS</button>
            <button class="off-btn" onclick="stopAll()">OFF</button>
        </nav>

        <div id="control-panel">
            <section id="tone-ui" class="mode-panel active">
                <div class="integrated-control-container">
                    <button class="integrated-side-btn" id="freqDownBtn">−</button>
                    <div class="main-knob" id="mainKnob">
                        <div class="knob-indicator"></div>
                        <div class="knob-center">
                            <div class="knob-value" id="freqReadout">49</div>
                            <div class="knob-unit">Hz</div>
                        </div>
                    </div>
                    <button class="integrated-side-btn" id="freqUpBtn">+</button>
                </div>
                <button id="tonePlayBtn" class="btn play-trigger">PLAY TONE</button>
            </section>

            <section id="sweep-ui" class="mode-panel">
                <div class="sweep-container">
                    <p>Slide to set start, release to sweep (7s)</p>
                    <input type="range" id="sweepSlider" min="35" max="55" step="0.5" value="35">
                    <div class="large-readout"><span id="sweepReadout">35.0</span> Hz</div>
                </div>
            </section>

            <section id="keyboard-ui" class="mode-panel">
                <div id="piano"></div>
            </section>
        </div>

        <div class="divider"></div>
        <div class="macro-grid" id="songGrid">
            </div>
    </main>

    <script src="songs.js"></script>
    <script src="script.js"></script>
</body>
</html>
